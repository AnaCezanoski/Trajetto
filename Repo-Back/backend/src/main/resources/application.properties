# Spring Application Name
spring.application.name=backend
server.port=8080

# Database connection URL
spring.datasource.url=jdbc:mysql://localhost:3306/trajetto?allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&useSSL=false&useUnicode=yes&characterEncoding=UTF-8&useLegacyDatetimeCode=true&createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC

# Database credentials
spring.datasource.username=root
spring.datasource.password=Biblioteca21.

# JPA and Hibernate settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# O esquema e mantido pelas migracoes do Flyway (src/main/resources/db/migration).
# A aplicacao apenas confere se o banco bate com as entidades e nunca mais o altera.
spring.jpa.hibernate.ddl-auto=validate
# Hibernate Naming Strategy for table names in uppercase
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway - versionamento do esquema do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Bancos que ja existiam antes do Flyway sao marcados na versao 1 e seguem dai em diante
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline schema

# SQL logging configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

